name: Verify scientific code and site
on:
  pull_request: {}
  push:
    branches: [main, arena/f1d591a5-gemsdoe52]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned CPU scientific environment
        run: python -m pip install -r requirements-r2.txt
      - name: Run numerical spatial and workflow regressions
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: python -m pytest -q
      - name: Verify all local website links JSON and download bytes
        run: python scripts/check_site.py
