name: Refresh competition feed

# This is what makes the site self-maintaining: nobody has to remember to check the leaderboard.
# The runner is a GitHub-hosted machine with normal internet egress, which this workspace does not
# have (drivendata.org is unreachable from the sandbox - see knowledge/06), so the *live* fetch has
# to happen here rather than in the analysis environment.
#
# The workflow never fabricates: if the page cannot be fetched or parsed it commits the previous
# snapshot with a loud `fetch_ok: false`, and the site renders that as a warning. The failure is also
# raised as a workflow error so a broken schedule cannot rot silently.
#
# It commits ONLY `docs/data/` (the feed).  It deliberately never touches `docs/downloads/` or
# `submission/`: publishing a new candidate raster has to stay a human decision, because a submission
# slot is spent once a week and cannot be recalled.

on:
  schedule:
    - cron: "17 */6 * * *"                    # four times a day, off the hour
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/refresh_feed.py"
      - ".github/workflows/feed.yml"

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No dependencies: scripts/refresh_feed.py is stdlib-only (urllib), on purpose, so a scheduled
      # refresh cannot fail on a package index.

      - name: Refresh the feed, fetching the live board when reachable
        run: |
          python scripts/refresh_feed.py --fetch || echo "fetch_failed=1" >> "$GITHUB_ENV"

      - name: Show what changed
        run: |
          git status --short
          git diff --stat || true
          python - <<'PY'
import json, pathlib
for name in ("leaderboard", "feed", "submission"):
    p = pathlib.Path("docs/data") / f"{name}.json"
    if not p.exists():
        print(f"{name}: MISSING")
        continue
    d = json.loads(p.read_text())
    if name == "leaderboard":
        rows = d.get("rows", [])
        top = rows[0].get("score") if rows else "n/a"
        print(f"leaderboard: status={d.get('status')}, rows={len(rows)}, top={top}, "
              f"fetched_utc={d.get('fetched_utc')}, gap_to_top={d.get('gap_to_top')}")
        print(f"  our rows: {d.get('our_rows')}")
        if rows:
            worst = rows[-1]
            print(f"  last visible row: #{worst.get('rank')} {worst.get('team')} {worst.get('score')}")
    elif name == "feed":
        print(f"feed: generated_utc={d.get('generated_utc')}, n_files={len(d.get('files', []))}, "
              f"leaderboard_status={d.get('leaderboard_status')}, submission={d.get('submission')}")
    else:
        print(f"{name}: " + ", ".join(f"{k}={d[k]}" for k in ("exists", "file", "download", "sha256")
                                      if k in d))
PY

      - name: Commit the refreshed feed
        if: always()
        run: |
          git config user.name "gems-feed-bot"
          git config user.email "41898282+gems-feed-bot@users.noreply.github.com"
          git add docs/data/ || true
          if ! git diff --cached --quiet; then
            git commit -m "feed: scheduled refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "feed unchanged; nothing to commit"
          fi

      - name: Fail loudly if the live fetch did not work
        if: env.fetch_failed == '1'
        run: |
          echo "::error::refresh_feed.py --fetch failed; the site is still showing the previous snapshot."
          exit 1
