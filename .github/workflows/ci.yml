name: ci
# Unit tests + pinned-mirror verification.  Runs on every pull request and on main.
on:
  pull_request: {branches: [main]}
  push: {branches: [main]}
  schedule: [{cron: '17 6 * * 1'}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Unit tests (metric, emission, submission format, slot gate)
        run: python -m pytest tests -q
      - name: Regenerate the site from the registry and fail if it is out of date
        run: |
          python scripts/build_site.py
          git add -A
          git diff --cached --quiet || (echo "::warning::generated site/root landing page is out of date; run scripts/build_site.py"; git diff --cached --stat)
  mirrors:
    # The mirrors are owner-hosted; if a byte changes, the digest check fails and nothing silently
    # enters a submission.  This job is the alarm.
    runs-on: ubuntu-latest
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy rasterio
      - run: python scripts/fetch_data.py --dest /tmp/gems32/data
